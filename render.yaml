# Render Blueprint. Person A: Render dashboard -> New -> Blueprint -> pick this repo.
# After first deploy, set MINIMAX_API_KEY (and MINIMAX_MODEL once verify:minimax names it).
services:
  - type: web
    name: tinywins
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    # Seed wipes + re-fills the ephemeral SQLite db on every boot (see DISCLOSURES.md)
    startCommand: npm run seed && npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: LLM_PROVIDER
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
      - key: MINIMAX_GROUP_ID
        sync: false
      - key: MINIMAX_MODEL
        sync: false
      - key: TOKENROUTER_API_KEY
        sync: false
      - key: TOKENROUTER_MODEL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
